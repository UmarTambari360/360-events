version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # P1-T01 enforces pnpm strictly; ignore npm/yarn updates if somehow suggested
      - dependency-name: "npm"
      - dependency-name: "yarn"